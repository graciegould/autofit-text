name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # npm 11.21+ is needed for `npm stage publish`
      - run: npm install -g npm@^11.21.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # The npm token is staging-only: this uploads the version to npm's
      # staging area. It goes live after a maintainer approves it with 2FA
      # (npmjs.com, or `npm stage list autofit-text` + `npm stage approve <id>`).
      - run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
